# Alembic configuration (Phase 6A)
#
# The real database URL is resolved by migrations/env.py with the priority:
#   -x db_url=...  >  env SECURITY_DIAGNOSIS_DB_URL  >  the default below.
# No absolute machine-specific path is required.
# Automated tests always point at a temporary SQLite database.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = sqlite:///./data/security-diagnosis.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
