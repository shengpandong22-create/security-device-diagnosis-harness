<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 890" width="680" height="890">
<defs>
  <marker id="arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M1 2L8 5L1 8" fill="#888"/>
  </marker>
  <style>
    .t { font: 14px sans-serif; fill: #2C2C2A; }
    .ts { font: 12px sans-serif; fill: #5F5E5A; }
    .th { font: 500 14px sans-serif; fill: #2C2C2A; }
    .arr { stroke: #888; stroke-width: 1.8; fill: none; marker-end: url(#arr-d); }
    .layer-box { fill: none; stroke: #B0B0B0; stroke-width: 1.2; stroke-dasharray: 6 3; }
    .layer-badge { font: 500 11px sans-serif; fill: #666; }
  </style>
</defs>

<text class="th" x="340" y="28" text-anchor="middle" font-size="16">可信安防设备诊断 Harness 总体架构</text>

<!-- 第1层 接入层 (蓝) -->
<rect class="layer-box" x="28" y="40" width="624" height="112" rx="10"/>
<text class="layer-badge" x="40" y="56">第1层</text>
<rect x="220" y="52" width="240" height="28" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text class="th" x="340" y="70" text-anchor="middle" fill="#042C53">接入层 User / API</text>
<rect x="60" y="96" width="270" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text class="th" x="195" y="114" text-anchor="middle" fill="#042C53">FastAPI 路由</text>
<text class="ts" x="195" y="132" text-anchor="middle">创建 · 运行 · 证据 · 审核 · 报告</text>
<rect x="370" y="96" width="250" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text class="th" x="495" y="114" text-anchor="middle" fill="#042C53">Bearer 认证</text>
<text class="ts" x="495" y="132" text-anchor="middle">operator / reviewer 职责分离</text>

<line x1="340" y1="160" x2="340" y2="184" class="arr"/>

<!-- 第2层 应用编排层 (紫) -->
<rect class="layer-box" x="28" y="192" width="624" height="112" rx="10"/>
<text class="layer-badge" x="40" y="208">第2层</text>
<rect x="220" y="204" width="240" height="28" rx="14" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
