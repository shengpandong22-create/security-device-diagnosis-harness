  <rect x="172" y="6" width="12" height="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="ts" x="190" y="16" fill="#666">推理</text>
  <rect x="232" y="6" width="12" height="12" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text class="ts" x="250" y="16" fill="#666">工具</text>
  <rect x="292" y="6" width="12" height="12" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="ts" x="310" y="16" fill="#666">存储/适配</text>
  <rect x="372" y="6" width="12" height="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="ts" x="390" y="16" fill="#666">跨层护栏</text>
