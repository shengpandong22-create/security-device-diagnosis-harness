<text class="ts" x="140" y="864" text-anchor="middle">CAS 乐观锁 · Alembic</text>
<rect class="pink" x="248" y="830" width="184" height="44" rx="8"/>
<text class="th" x="340" y="847" text-anchor="middle">追加式 Audit</text>
<text class="ts" x="340" y="864" text-anchor="middle">一致性扫描 · 备份恢复</text>
<rect class="pink" x="448" y="830" width="184" height="44" rx="8"/>
<text class="th" x="540" y="847" text-anchor="middle">Knowledge Store</text>
<text class="ts" x="540" y="864" text-anchor="middle">confirmed-only RAG</text>
<rect class="pink" x="48" y="890" width="584" height="44" rx="8"/>
<text class="th" x="340" y="907" text-anchor="middle">评测治理</text>
<text class="ts" x="340" y="924" text-anchor="middle">Dataset(dev/val/test) · Grader · 失败归因 · Release Gate</text>

