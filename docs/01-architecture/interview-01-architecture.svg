<rect class="layer-box" x="28" y="544" width="624" height="174" rx="10"/>
<text class="layer-badge" x="40" y="560">第4层</text>
<rect class="orange" x="240" y="556" width="200" height="28" rx="14"/>
<text class="th" x="340" y="574" text-anchor="middle">工具与设备层</text>
<rect class="orange" x="48" y="602" width="184" height="44" rx="8"/>
<text class="th" x="140" y="619" text-anchor="middle">ToolRegistry</text>
<text class="ts" x="140" y="636" text-anchor="middle">权限·只读·参数闸门</text>
