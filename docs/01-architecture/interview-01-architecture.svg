  <rect x="204" y="6" width="12" height="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <text class="ts" x="220" y="15">AI 推理</text>
  <rect x="284" y="6" width="12" height="12" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
  <text class="ts" x="300" y="15">工具与设备</text>
  <rect x="380" y="6" width="12" height="12" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.8"/>
