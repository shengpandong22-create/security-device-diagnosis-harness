<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Security Device Diagnosis Harness 总体架构</title>
  <desc id="desc">展示用户故障请求经过 API、应用服务、Agent Harness、设备网关、Evidence、人工确认和评测回归形成安防设备诊断闭环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}
      .title{font-size:26px;font-weight:700;fill:#0f3f73}
      .subtitle{font-size:15px;fill:#475569}
      .node-title{font-size:17px;font-weight:700}
      .small{font-size:13px;fill:#475569}
      .blue{fill:#e8f3ff;stroke:#2f80c9;stroke-width:1.8}
      .purple{fill:#f1edff;stroke:#7c3aed;stroke-width:1.8}
      .coral{fill:#fff0eb;stroke:#c05621;stroke-width:1.8}
      .green{fill:#e2f6ef;stroke:#0f766e;stroke-width:1.8}
      .cyan{fill:#dcfafa;stroke:#0e9f9a;stroke-width:1.8}
      .orange{fill:#fff3df;stroke:#d97706;stroke-width:1.8}
      .line{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .main{stroke:#d97706;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#475569;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="44" y="46" class="title">Security Device Diagnosis Harness：安防设备可信诊断底座</text>
  <text x="44" y="76" class="subtitle">LLM 负责推理；Harness 负责事实、权限、证据、状态、人工确认和评测。</text>

  <rect x="44" y="145" width="150" height="82" rx="18" class="blue"/>
  <text x="119" y="178" text-anchor="middle" class="node-title">用户/运维人员</text>
  <text x="119" y="205" text-anchor="middle" class="small">摄像头黑屏等现象</text>

  <rect x="248" y="132" width="160" height="108" rx="18" class="blue"/>
  <text x="328" y="168" text-anchor="middle" class="node-title">API Layer</text>
  <text x="328" y="196" text-anchor="middle" class="small">创建 · 查询 · 反馈</text>
  <text x="328" y="218" text-anchor="middle" class="small">报告查询</text>

  <rect x="462" y="132" width="220" height="108" rx="18" class="blue"/>
  <text x="572" y="168" text-anchor="middle" class="node-title">SecurityDiagnosisService</text>
  <text x="572" y="196" text-anchor="middle" class="small">状态推进 · 用例编排</text>
  <text x="572" y="218" text-anchor="middle" class="small">调用 Agent Harness</text>

  <rect x="742" y="104" width="355" height="272" rx="22" class="purple"/>
  <text x="766" y="138" class="node-title" fill="#4c1d95">Agent Harness</text>
  <rect x="782" y="166" width="130" height="88" rx="14" class="purple"/>
  <text x="847" y="198" text-anchor="middle" class="node-title">Runner</text>
  <text x="847" y="224" text-anchor="middle" class="small">受控 Loop</text>
  <rect x="942" y="166" width="124" height="88" rx="14" class="coral"/>
  <text x="1004" y="198" text-anchor="middle" class="node-title">LLM Port</text>
  <text x="1004" y="224" text-anchor="middle" class="small">Fake / DeepSeek</text>
  <rect x="782" y="276" width="130" height="72" rx="14" class="green"/>
  <text x="847" y="306" text-anchor="middle" class="node-title">Registry</text>
  <text x="847" y="329" text-anchor="middle" class="small">权限/风险/预算</text>
  <rect x="942" y="276" width="124" height="72" rx="14" class="green"/>
  <text x="1004" y="306" text-anchor="middle" class="node-title">Citation</text>
  <text x="1004" y="329" text-anchor="middle" class="small">引用校验</text>

  <rect x="750" y="474" width="170" height="88" rx="18" class="purple" stroke-dasharray="8 6"/>
  <text x="835" y="508" text-anchor="middle" class="node-title">DeviceGateway Port</text>
  <text x="835" y="534" text-anchor="middle" class="small">状态 · 告警 · 配置</text>

  <rect x="978" y="474" width="170" height="88" rx="18" class="cyan"/>
  <text x="1063" y="508" text-anchor="middle" class="node-title">Static Adapter</text>
  <text x="1063" y="534" text-anchor="middle" class="small">JSON 样例数据</text>

  <rect x="1182" y="132" width="100" height="108" rx="18" class="green"/>
  <text x="1232" y="168" text-anchor="middle" class="node-title">Evidence</text>
  <text x="1232" y="196" text-anchor="middle" class="small">设备事实</text>
  <text x="1232" y="218" text-anchor="middle" class="small">可追踪</text>

  <rect x="462" y="474" width="186" height="88" rx="18" class="orange"/>
  <text x="555" y="508" text-anchor="middle" class="node-title">Human Review</text>
  <text x="555" y="534" text-anchor="middle" class="small">确认/驳回/继续调查</text>

  <rect x="248" y="474" width="160" height="88" rx="18" class="green"/>
  <text x="328" y="508" text-anchor="middle" class="node-title">Knowledge</text>
  <text x="328" y="534" text-anchor="middle" class="small">confirmed 后沉淀</text>

  <rect x="44" y="474" width="150" height="88" rx="18" class="blue"/>
  <text x="119" y="508" text-anchor="middle" class="node-title">Eval Harness</text>
  <text x="119" y="534" text-anchor="middle" class="small">固定案例 + Rubric</text>

  <path d="M194 186 H248" class="main"/>
  <path d="M408 186 H462" class="main"/>
  <path d="M682 186 H742" class="main"/>
  <path d="M912 210 H942" class="line"/>
  <path d="M1004 254 V276" class="line"/>
  <path d="M942 312 H912" class="line"/>
  <path d="M847 348 V474" class="main"/>
  <path d="M920 518 H978" class="line"/>
  <path d="M1148 518 H1232 V240" class="main"/>
  <path d="M1182 186 H1066 V312" class="main"/>
  <path d="M942 312 H912" class="line"/>
  <path d="M942 312 H912" class="line"/>
  <path d="M942 312 H920 V430 H648 V518" class="main"/>
  <path d="M462 518 H408" class="dash"/>
  <path d="M248 518 H194" class="dash"/>
  <path d="M119 474 V405 H572 V240" class="dash"/>

  <text x="780" y="660" class="small">关键边界：设备不在线、告警存在、配置异常都只是证据；confirmed 必须人工确认，不能由模型直接产生。</text>
</svg>
